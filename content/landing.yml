about:
  headline: "Hi, I'm Kyle Shovan"
  body: "I'm a web developer. My day job is at Adomi, where I build open-source software that small businesses can own, host anywhere, and run themselves. This website is where I write about code, business, the projects I'm building, hobbies, the dog, and whatever else I'm thinking about."
callouts:
  adomi:
    eyebrow: "FROM THE DAY JOB"
    headline: "Need help with your small business’s software?"
    body: "Adomi delivers modern open-source business software including CRM, ERP, identity, and automation. It's affordable, easy to run, and yours to keep. No vendor lock-in. Runs on any cloud, or your own hardware."
    ctaLabel: "See Adomi’s work"
    ctaHref: "https://github.com/adomi-io"
    external: true
    color: "orange"
  contact:
    eyebrow: "OPEN FOR NEW WORK"
    headline: "Got a project in mind?"
    body: "Quick conversations beat long forms. Drop me a line and I'll get back to you within a couple of days."
    ctaLabel: "Get in touch"
    ctaHref: "#contact"
    color: "teal"
  about:
    eyebrow: "ABOUT"
    headline: "Curious who's writing this?"
    body: "I'm Kyle, a web developer building open source software for small businesses. This site is where I write about whatever's on my mind."
    ctaLabel: "More about me"
    ctaHref: "/#about"
    color: "indigo"
  feedback:
    eyebrow: "HAVE THOUGHTS?"
    headline: "Let me know what you think."
    body: "Disagree, want to add to the conversation, or just say hi? I read every email and reply to most within a few days."
    ctaLabel: "Send a note"
    ctaHref: "/#contact"
    color: "teal"
