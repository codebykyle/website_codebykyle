name: docker

# Build the Docker image on every push and PR.
# Push to GHCR only on pushes to the default branch (or manual dispatch),
# never from a PR — PR builds verify the Dockerfile without leaking images.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# GHCR auth needs `packages: write`. Read perms on contents for checkout.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # branch name (`main`)
            type=ref,event=branch
            # PR head ref (`pr-42`)
            type=ref,event=pr
            # short commit SHA (`sha-abc1234`)
            type=sha,format=short
            # semver tags from `v1.2.3` git tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` only when pushing to the default branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only for faster CI. Add linux/arm64 here if you need
          # Hetzner CAX / AWS Graviton / Apple Silicon images.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
